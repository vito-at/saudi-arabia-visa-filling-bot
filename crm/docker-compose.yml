services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 5s
      retries: 10
    # Порт наружу нужен только для локальной разработки (npm run dev на хосте)
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@db:5432/${POSTGRES_DB:-crm}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@db:5432/${POSTGRES_DB:-crm}?schema=public
    command: ["npm", "run", "worker"]
    depends_on:
      app:
        condition: service_started

  # Сайт проверки документов по QR-коду для Ипотека-банка — отдельный проект vito-at/qr-code-creator.
  # Образ собирается прямо из его репозитория (ветка main); Caddy ниже отдаёт его по домену VERIFY_DOMAIN.
  # Запускается только на сервере (вместе с Caddy, профиль https). Данные — в томе qrdata.
  qr-code-app:
    build: https://github.com/vito-at/qr-code-creator.git#main
    restart: unless-stopped
    profiles: ["https"]
    environment:
      BASE_URL: https://${VERIFY_DOMAIN:-hujjat-ipotekabank.uz}
      ADMIN_PATH: boshqaruv
      # хэш начального пароля (scrypt; «$$» — экранированный «$»). Пароль меняется в админке сайта
      ADMIN_PASSWORD_HASH: "scrypt$$16384$$8$$1$$3-YO-3m32dIXxV8bgNYlaA$$exYuS7HE8IkI16koFKMa3GnU7gjsBiMZa-21YWOxHqs"
      TZ: Asia/Tashkent
    volumes:
      - qrdata:/data

  # HTTPS-прокси: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
      LINKS_DOMAIN: ${LINKS_DOMAIN:-link.orienttravel.uz}
      VERIFY_DOMAIN: ${VERIFY_DOMAIN:-hujjat-ipotekabank.uz}   # сайт проверки документов (отдельный проект qr-code-creator)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../links:/srv/links:ro   # страница-визитка (после git pull обновляется сама)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  qrdata:
  caddy_data:
  caddy_config:
