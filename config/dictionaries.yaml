# Словари для выпадающих списков портала.
# Формат:  категория -> канонический ключ -> список синонимов (как может быть написано
# на портале, в паспорте или в сообщении клиента). Регистр и знаки препинания не важны.
#
# Когда пришлёте запись codegen и скриншоты, я добавлю сюда ТОЧНЫЕ тексты пунктов
# с портала. Если бот не смог сопоставить значение — он спросит вас, а вы сможете
# дописать новый синоним сюда за минуту.

